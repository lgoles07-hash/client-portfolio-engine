
name: Refresh data
on: workflow_dispatch
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas matplotlib yfinance
      - run: python fetch_data.py
      - run: python run.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data output
          git commit -m "Refresh data from Yahoo Finance" || echo "No changes"
          git push
